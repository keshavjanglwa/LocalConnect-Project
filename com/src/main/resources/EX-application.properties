spring.application.name=LocalConnect

spring.datasource.url= Enter your database URL here
spring.datasource.username= Enter your database username here
spring.datasource.password= Enter your database password here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Secret key required in the "secretKey" field of POST /api/admin/register.
# Only people who know this value can create an admin account. Change it to
# your own value and keep it private (do not commit the real value to git).
admin.registration.secret-key=CHANGE_ME_TO_A_LONG_RANDOM_SECRET
