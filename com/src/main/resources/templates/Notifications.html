<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications - Locality Connect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h1>Notifications</h1>

    <div th:if="${#lists.isEmpty(notifications)}" class="empty-state">
        No notifications yet. Replies, group activity and accepted requests will show up here.
    </div>

    <div class="card" th:each="n : ${notifications}"
         th:style="${n.read} ? '' : 'border-left: 4px solid #2f6f4e;'">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <p th:text="${n.message}" style="margin:0;">Notification message</p>
            <form th:if="${!n.read}" th:action="@{'/notifications/' + ${n.id} + '/read'}" method="post">
                <button type="submit" class="btn btn-small btn-secondary">Mark read</button>
            </form>
        </div>
        <div class="meta" th:text="${#temporals.format(n.createdAt, 'dd MMM, hh:mm a')}">time</div>
    </div>
</div>
</body>
</html>
