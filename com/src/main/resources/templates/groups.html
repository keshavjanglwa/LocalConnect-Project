<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Groups - Locality Connect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>Private Community Groups</h1>
        <a th:href="@{/groups/new}" class="btn">+ Create Group</a>
    </div>

    <div th:if="${#lists.isEmpty(groups)}" class="empty-state">
        No groups in your locality yet. Start one!
    </div>

    <div class="card" th:each="g : ${groups}">
        <h3><a th:href="@{'/groups/' + ${g.id}}" th:text="${g.name}">Group Name</a></h3>
        <div class="meta">
            <span th:text="${g.locality}">Locality</span> ·
            Owner: <span th:text="${g.owner.name}">Owner</span> ·
            <span th:text="${g.isPrivate} ? 'Private' : 'Public'">Private</span>
        </div>
        <p th:text="${g.description}">Description</p>
        <a th:href="@{'/groups/' + ${g.id}}" class="btn btn-small btn-secondary">View Group</a>
    </div>
</div>
</body>
</html>
